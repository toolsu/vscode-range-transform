name: Deploy site

# Builds the website and deploys it to https://toolsu.com/range-transform/ as a Cloudflare
# Worker with static assets (site/wrangler.jsonc). Needs the CLOUDFLARE_API_TOKEN secret: an
# API token with Account > Workers Scripts > Edit and Zone (toolsu.com) > Workers Routes >
# Edit.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install site modules
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: bun run build:pages

      - name: Deploy to Cloudflare
        working-directory: site
        run: bunx wrangler@4.137.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
