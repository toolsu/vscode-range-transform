name: Marketplace identity (one-off)

# Run once by hand to learn the managed identity's Azure DevOps profile id, which is what
# the Marketplace publisher's Members search accepts. Delete this workflow afterwards.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-id:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print the Azure DevOps profile id
        run: |
          id="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "Azure DevOps profile id: ${id}"
          echo "### Azure DevOps profile id: \`${id}\`" >> "$GITHUB_STEP_SUMMARY"
