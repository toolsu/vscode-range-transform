name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check-types
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:unit

      - name: Start a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - run: bun run test:e2e

      # Built once and published everywhere, so both registries serve the same bytes.
      - name: Package
        run: bunx @vscode/vsce package --no-dependencies --out range-transform.vsix

      - name: Publish to the Visual Studio Marketplace
        if: github.repository == 'toolsu/vscode-range-transform'
        run: bunx @vscode/vsce publish --no-dependencies --packagePath range-transform.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

      - name: Publish to Open VSX
        if: github.repository == 'toolsu/vscode-range-transform'
        run: bunx ovsx publish range-transform.vsix
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: range-transform.vsix
          generate_release_notes: true
