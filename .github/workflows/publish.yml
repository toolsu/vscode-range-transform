name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check-types
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:unit

      - name: Start a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - run: bun run test:e2e

      # Built once and published everywhere, so both registries serve the same bytes.
      - name: Package
        run: bunx @vscode/vsce package --no-dependencies --out range-transform.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: range-transform.vsix
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'toolsu/vscode-range-transform'
    runs-on: ubuntu-latest
    # The Azure managed identity trusts this environment (its federated credential names
    # it), so only jobs running in it can sign in as the Marketplace publisher.
    environment: marketplace-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Microsoft Entra ID instead of a personal access token: GitHub's OIDC token is
      # exchanged for the managed identity, which is a Contributor on the publisher.
      - name: Sign in to Azure as the publishing identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the Visual Studio Marketplace
        run: bunx @vscode/vsce publish --no-dependencies --packagePath range-transform.vsix --azure-credential

      - name: Make sure the Open VSX namespace exists
        run: |
          if ! curl -sf https://open-vsx.org/api/tomchen > /dev/null; then
            bunx ovsx create-namespace tomchen
          fi
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}

      - name: Publish to Open VSX
        run: bunx ovsx publish range-transform.vsix
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: range-transform.vsix
          generate_release_notes: true
